<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">1Fi Marketplace animated user flow</title>
  <desc id="desc">Animated flow from Shop to Proceed CTA</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#712CDC"/>
      <stop offset="100%" stop-color="#8c27fc"/>
    </linearGradient>
    <style>
      .card { fill: #ffffff; stroke: #E5E7EB; stroke-width: 2; }
      .active { stroke: #712CDC; stroke-width: 3; }
      .label { font-family: Segoe UI, Arial, sans-serif; font-size: 14px; fill: #111827; font-weight: 650; }
      .sub { font-family: Segoe UI, Arial, sans-serif; font-size: 11px; fill: #6B7280; }
      .dot { fill: url(#g); }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .flow { stroke: #712CDC; stroke-width: 3; fill: none; stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
      .step { opacity: 0.35; animation: reveal 6s ease-in-out infinite; }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: 1s; }
      .s3 { animation-delay: 2s; }
      .s4 { animation-delay: 3s; }
      .s5 { animation-delay: 4s; }
      .s6 { animation-delay: 5s; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes reveal {
        0%, 8% { opacity: 0.35; }
        12%, 20% { opacity: 1; }
        28%, 100% { opacity: 0.55; }
      }
    </style>
  </defs>
  <rect width="960" height="220" rx="18" fill="#F7F5FB"/>
  <text x="24" y="36" class="label" style="font-size:18px">Marketplace working flow</text>
  <text x="24" y="56" class="sub">Shop ’ Browse ’ Detail ’ Variants ’ EMI ’ Proceed</text>

  <g class="step s1" transform="translate(24,80)">
    <rect class="card active" width="130" height="100" rx="14"/>
    <circle class="dot pulse" cx="24" cy="28" r="10"/>
    <text x="42" y="33" class="label">Shop</text>
    <text x="16" y="62" class="sub">3 tabs</text>
    <text x="16" y="80" class="sub">Marketplace</text>
  </g>
  <path class="flow" d="M160 130 H186"/>

  <g class="step s2" transform="translate(190,80)">
    <rect class="card" width="130" height="100" rx="14"/>
    <circle class="dot" cx="24" cy="28" r="10"/>
    <text x="42" y="33" class="label">Browse</text>
    <text x="16" y="62" class="sub">Product grid</text>
    <text x="16" y="80" class="sub">API loaded</text>
  </g>
  <path class="flow" d="M326 130 H352"/>

  <g class="step s3" transform="translate(356,80)">
    <rect class="card" width="130" height="100" rx="14"/>
    <circle class="dot" cx="24" cy="28" r="10"/>
    <text x="42" y="33" class="label">Detail</text>
    <text x="16" y="62" class="sub">Image + price</text>
    <text x="16" y="80" class="sub">Highlights</text>
  </g>
  <path class="flow" d="M492 130 H518"/>

  <g class="step s4" transform="translate(522,80)">
    <rect class="card" width="130" height="100" rx="14"/>
    <circle class="dot" cx="24" cy="28" r="10"/>
    <text x="42" y="33" class="label">Variants</text>
    <text x="16" y="62" class="sub">Storage</text>
    <text x="16" y="80" class="sub">Colour</text>
  </g>
  <path class="flow" d="M658 130 H684"/>

  <g class="step s5" transform="translate(688,80)">
    <rect class="card" width="120" height="100" rx="14"/>
    <circle class="dot" cx="24" cy="28" r="10"/>
    <text x="42" y="33" class="label">EMI</text>
    <text x="16" y="62" class="sub">Select plan</text>
    <text x="16" y="80" class="sub">No-cost</text>
  </g>
  <path class="flow" d="M814 130 H838"/>

  <g class="step s6" transform="translate(842,80)">
    <rect class="card active" width="94" height="100" rx="14" fill="#F3EBFF"/>
    <circle class="dot pulse" cx="22" cy="28" r="10"/>
    <text x="38" y="33" class="label">CTA</text>
    <text x="12" y="62" class="sub">Proceed</text>
    <text x="12" y="80" class="sub">Confirm</text>
  </g>
</svg>
